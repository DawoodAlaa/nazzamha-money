<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="نظمها — فلوسك، ديونك وأقساطك في مكان واحد">
  <meta name="theme-color" content="#F3F6FC">

  <!-- iPhone "Add to Home Screen": full screen, own icon and name -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="نظمها">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>نظمها — المال</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="app.css">
  <link rel="modulepreload" href="store.js">
  <link rel="modulepreload" href="icons.js">

  <style>
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #f3f6fc; z-index: 100; }
    #boot img { width: 96px; height: 96px; border-radius: 24px; }
    #boot-err { display: none; max-width: 86%; padding: 12px 14px; border-radius: 12px; background: #fdeeee; color: #b91c1c; font-size: 13px; }
  </style>
</head>
<body>
  <div id="boot"><img src="icons/Icon-192.png" alt="نظمها"><div id="boot-err"></div></div>
  <div id="app"></div>

  <script>
    // Anything that stops the app from starting is shown on screen.
    window.addEventListener('error', function (e) {
      var b = document.getElementById('boot-err');
      if (b && document.getElementById('boot')) { b.style.display = 'block'; b.textContent += (e.message || 'Error') + '\n'; }
    });
    // "?nosw" skips offline caching (for testing changes).
    if ('serviceWorker' in navigator && location.search.indexOf('nosw') < 0) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
